# Full-stack MetroStack development environment
# Runs PostgreSQL, Redis, Backend API, and Frontend together

services:
  # -- PostgreSQL with PostGIS + pgpointcloud -----------------------------------
  db:
    build:
      context: ./backend
      dockerfile: db.Dockerfile
    container_name: metrostack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: metrostack
      POSTGRES_DB: metrostack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - metrostack

  # -- Redis (for Celery task queue) --------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: metrostack_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - metrostack

  # -- FastAPI backend ----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrostack_api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: metrostack
      POSTGRES_DB: metrostack
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      UPLOAD_DIR: /app/uploads
      # UPDATED: Wildcard added to allow external local network requests
      CORS_ORIGINS: '["http://localhost:3001","http://localhost:5173","http://localhost:5500","http://127.0.0.1:5500","*"]'
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_TRACK_STARTED: "true"
      CELERY_TASK_TIME_LIMIT: 120
      CELERY_TASK_SOFT_TIME_LIMIT: 100
      CELERY_TASK_SEND_SENT_EVENT: "true"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    develop:
      watch:
        - path: ./backend/app
          target: /app/app
          action: sync
    networks:
      - metrostack

  # -- React + Vite frontend ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: metrostack_frontend
    ports:
      - "3000:3000"
    environment:
      # UPDATED: Replace the placeholder below with your actual Windows machine IP address
      VITE_API_URL:  http://localhost:3001/
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0
    networks:
      - metrostack

  # -- pgAdmin (optional) -------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: metrostack_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@metrostack.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - metrostack

volumes:
  postgres_data:
  upload_data:

networks:
  metrostack:
    driver: bridge